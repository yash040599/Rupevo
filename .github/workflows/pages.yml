# Publishes site/ to GitHub Pages. The deployed copy is stamped first
# (scripts/stamp_site.py): versioned asset URLs, so a browser never combines
# cached old modules with new ones, and preload hints, so each page fetches
# its modules in parallel. site/ itself stays build-free.
#
# Runs on pushes that touch the site, by hand, and as a reusable step at the
# end of "Refresh market data" (data commits made with GITHUB_TOKEN do not
# trigger push workflows, so that workflow calls this one directly).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/stamp_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the branch head rather than the triggering SHA so a data
      # commit pushed earlier in a calling workflow is part of the deploy.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Stamp asset versions and preload hints
        run: python3 scripts/stamp_site.py site _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
