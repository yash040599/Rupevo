# Rebuilds the ranking snapshots and the tax tools' reference data, commits
# them and redeploys the site.
#
# Triggered by the admin "Analyse now" button on the website (workflow
# dispatch through the GitHub API), by "Run workflow" on the Actions tab, and
# weekly on a schedule. The weekly run refreshes only the tax data (SBI
# exchange rates, prices, dividends); rankings stay admin-triggered unless
# another schedule is added below.
name: Refresh market data
run-name: Refresh market data (${{ github.event_name == 'schedule' && (github.event.schedule == '30 2 * * 1' && 'tax' || 'both') || inputs.market || 'both' }})

on:
  workflow_dispatch:
    inputs:
      market:
        description: What to refresh (the tax data is refreshed on every run)
        type: choice
        options: [both, india, us, tax]
        default: both
  schedule:
    - cron: "30 2 * * 1"   # Mondays 08:00 IST: tax data only
  # Any other schedule refreshes both rankings too, for example (UTC):
  #   - cron: "15 11 * * 1-5"   # 16:45 IST, after the NSE close

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      MARKET: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 2 * * 1' && 'tax' || 'both') || inputs.market || 'both' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # US fundamentals are cached for 14 days between runs.
      - name: Restore pipeline cache
        if: env.MARKET != 'tax'
        uses: actions/cache/restore@v6
        with:
          path: .cache/us_fundamentals.json
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      # NSE / Nasdaq sometimes block cloud IPs; the checked-in lists are kept then.
      - name: Update index constituents
        if: env.MARKET != 'tax'
        continue-on-error: true
        run: python -m pipeline universe

      - name: Build rankings
        id: refresh
        if: env.MARKET != 'tax'
        continue-on-error: true
        run: python -m pipeline refresh --market "$MARKET"

      - name: Save pipeline cache
        if: always() && env.MARKET != 'tax' && hashFiles('.cache/us_fundamentals.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/us_fundamentals.json
          key: pipeline-cache-${{ github.run_id }}

      # Exchange rates, prices and dividends used by the RSU tax tools.
      - name: Update tax data
        id: taxdata
        continue-on-error: true
        run: python -m pipeline tax-data

      - name: Check the data is safe to publish
        run: python -m unittest tests.test_published_data tests.test_tax_data -v

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data pipeline/universes/*.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh ${MARKET} ($(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report data that could not be refreshed
        if: steps.refresh.outcome == 'failure' || steps.taxdata.outcome == 'failure'
        run: |
          echo "::error::Some data failed to refresh and kept its previous version. See the 'Build rankings' and 'Update tax data' steps."
          exit 1

  deploy:
    needs: refresh
    if: always() && needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
