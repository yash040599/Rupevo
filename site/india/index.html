<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indian Nifty 100 Ranking — Rupevo</title>
  <meta name="description" content="Daily technical ranking of India's Nifty 100 stocks: setups, technical scores, risk grades and 52-week dips from end-of-day prices.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com https://api.web3forms.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta property="og:title" content="Indian Nifty 100 Ranking — Rupevo">
  <meta property="og:description" content="Technical setups, scores and risk grades for the Nifty 100.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/rupevo.css">
  <script src="../assets/js/boot.js"></script>
  <script type="module" src="../assets/js/india.js"></script>
</head>
<body>
  <header id="site-nav"></header>
  <main id="app" class="wrap" aria-busy="true">
    <section class="hero">
      <div class="eyebrow">India · NSE</div>
      <h1>Nifty 100 Ranking</h1>
      <p class="lede">Technical setups across India's 100 largest listed companies, ranked from
        end-of-day prices. Stocks with a qualifying setup come first, followed by stocks trading 10% or
        more below their 52-week high.</p>
      <div class="sync-bar" id="sync-bar"><span class="skel" style="width:320px"></span></div>
    </section>
    <noscript><div class="banner warn">This page needs JavaScript to display the ranking.</div></noscript>
    <div id="notice"></div>
    <div class="tiles" id="tiles"></div>
    <section class="card" id="changes" hidden></section>
    <section class="card" id="ranked-card">
      <span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span>
    </section>
    <section class="card" id="others-card" hidden></section>
    <section class="card" id="method-card">
      <details class="fold"><summary><h2>How this ranking works</h2></summary><div id="method-body"></div></details>
    </section>
    <aside class="card trivia-card" data-trivia="market" aria-label="Stories from the market">
      <span class="skel" style="width:40%"></span><span class="skel"></span><span class="skel"></span>
    </aside>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
